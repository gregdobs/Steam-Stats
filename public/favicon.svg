<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Badge background -->
  <rect width="48" height="48" rx="11" fill="url(#bg)"/>

  <!-- Controller body — enlarged, minimal padding so it still reads at 16px -->
  <rect x="6" y="16" width="36" height="17" rx="8.5" fill="#ffffff"/>
  <circle cx="13.5" cy="30.5" r="8" fill="#ffffff"/>
  <circle cx="34.5" cy="30.5" r="8" fill="#ffffff"/>

  <!-- D-pad reimagined as a bold ascending bar chart: controller + stats in one mark -->
  <rect x="15" y="26"   width="4" height="7"  rx="1.3" fill="#10b981"/>
  <rect x="21" y="22.5" width="4" height="10.5" rx="1.3" fill="#10b981"/>
  <rect x="27" y="19"   width="4" height="14" rx="1.3" fill="#10b981"/>
</svg>
